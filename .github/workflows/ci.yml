name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Без torch: тесты логики идут на подставном детекторе.
      - name: Установка лёгких зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.2.6 opencv-python-headless==4.12.0.88 psutil==7.2.2 \
            fastapi==0.142.2 uvicorn==0.54.0 python-multipart==0.0.32
          pip install -r requirements-dev.txt
      - name: Стиль (ruff)
        run: ruff check .
      - name: Тесты
        run: pytest -m "not integration"
